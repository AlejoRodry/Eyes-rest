<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descanso Ocular</title>
    <style>
        :root {
            /* Colores de Modo Oscuro Nativo */
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --success-color: #03dac6;
            --danger-color: #cf6679;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        .card {
            background-color: var(--surface-color);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 80%;
            max-width: 320px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: rgba(3, 218, 198, 0.2);
            color: var(--success-color);
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .status.paused {
            background-color: rgba(207, 102, 121, 0.2);
            color: var(--danger-color);
        }

        .timer {
            font-size: 4rem;
            font-weight: 700;
            margin: 1.5rem 0;
            font-variant-numeric: tabular-nums; /* Evita que los números salten */
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }

        button.primary {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        button.primary:hover {
            background-color: #a06ee1;
            border-color: #a06ee1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Regla 20-20-20</h2>
        <div id="statusIndicator" class="status">Protección Activa</div>
        <div id="timerDisplay" class="timer">20:00</div>
        
        <div class="controls">
            <button id="toggleBtn" class="primary">Pausar Temporizador</button>
            <button id="testBtn">Probar Notificación</button>
        </div>
    </div>

    <!-- Cargamos la lógica del renderizador -->
    <script src="renderer.js"></script>
</body>
</html>
